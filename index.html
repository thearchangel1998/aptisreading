        { id: 4, title: "Test 4: Consumer Age", part1: { text: "Dear Mum and Dad, I just got here. Everyone is {1}. My flat is near university, so I can {2} to my class. There is a girl living with me, I met her for the {3} time. She is from France and she can {4} 5 languages. We eat dinner {5}.", options: [["friendly","melty","noisy"], ["train","sleep","walk"], ["very","first","one"], ["talk","say","speak"], ["toward","together","another"]], answers: ["friendly", "walk", "first", "speak", "together"] }, part2: { topic1: { title: "Hand in Assignment", sentences: ["When you are sure there are no mistakes left, print out your report.", "First, it is a good idea to check your report and correct mistakes.", "The staff member will take your report and confirm that everything is complete.", "Next, complete a cover sheet with your name and your student number, and attach it to your printed assignment.", "Bring your assignment with the attached cover sheet to the front desk in the main hall."], order: [2, 1, 5, 3, 4] }, topic2: { title: "Car Park", sentences: ["The machine will read your information and tell you how much you have to pay.", "This ticket will show the date and the time you arrived.", "When you arrive, please take a ticket from a machine at the entrance.", "Before you leave, please put the ticket on the machine by the gate.", "Please display the ticket with this information in the window of your car."], order: [5, 2, 1, 4, 3] } }, part3: { texts: { A: "When I first came to this city, I felt very scared because this city is very big. The city has many parts and the shopping part is very far from the green part. However, we already had the bus route and we signed up to take the bus for a full day. Buses are very cheap and very convenient. I feel very lucky to not have to put pressure on my sore feet", B: "I don't like big cities and rarely go out to cities. But I go to the StevenSon city very often. I go there about five to seven times a year. There is an area outside the city. In that area, there are many things that I need. There is a lot of water, a natural area, a small forest and a special camping area. I really like coming to this place to rest. It also has a great coffee serving area for visitors", C: "I went to this city last summer and really liked the atmosphere of this city. The reason I like the atmosphere here is because it has a lot of public performances. These performances often take place in front of department stores. So this prevents me from shopping inside those stores. I was very surprised when I came home with an empty bag and I didn't buy anything.", D: "When I go out, I only care about two things: good food and a good play. I especially liked the lunch I had in this city, it was delicious and I really want to come back here next time. However, I guess it's a bit expensive and I have to walk a long way to get there. However, it didn't matter because I had a wonderful day" }, questions: ["Who likes the natural resort here?", "Who thought public transport system was good?", "Who wants to visit one part of the city?", "Who likes the public theatre that the city puts on?", "Who pays a lot for their meal?", "Who usually spends a lot of money on shopping?", "Who thinks walking too much causes a problem?"], answers: ["B", "A", "B", "C", "D", "C", "A"] }, part4: { paragraphs: ["Mrs. Judith Levine - a journalist and her husband decided to change their lifestyle to be as minimalist as possible. They only buy what is absolutely necessary, such as food for work. They do not go to the cinema, cafes, restaurants. As a writer, I can say that she is saving for a purpose of publishing her findings as a book.", "Published in 2006, the book Not Buying It when reread 10 years later still holds its value. They believe that journalist Ms. Levine has the ability to predict future consumer trends. The minimalist lifestyle she mentioned has become a trend today.", "To make this experiment as realistic as possible, Ms. Levine and her husband decided not to tell anyone, because they knew that once their friends knew about this plan, they would mention the issue of paying for the couple's share when they went out together. Therefore, the couple was determined to keep it a secret from friends, family and strangers.", "The couple wanted to buy a gift as a gift. However, that went against their point of not buying unnecessary things. And they decided to make it themselves to have a lower spending level. However, none of them have any aesthetic talent, so they finally decided to give a meaningful and practical gift to the recipient, which is a piece of their jewelry.", "Lessons about minimalism in today's consumer trends: buy things that are really necessary, switch from driving cars and motorbikes to cycling and walking.", "Ms. Levine does not have an office, which is quite inconvenient when she has to meet partners in a coffee shop. When working alone, she often goes to the public library and finds it very convenient.", "In today's modern consumer age, people tend to own more than they used to. A worker only has 5-6 pairs of shoes in his entire life. And he will repair them when they break or wear out, not throw them away. Nowadays, if we have a phone, it is expected that you will use such electronic devices throughout your life." ], headings: ["A temporary experiment", "Still relevant to our times", "Important lessons for all of us", "The difficulty of being generous", "Making things last longer", "Reason to reach a compromise", "The reason of secrecy"], answers: [0, 1, 6, 3, 2, 5, 4] } },
        { id: 5, title: "Test 5: Doggett", part1: { text: "I start {1} in the morning. I have {2}. I {3} the office. I go home in my new {4}. I go to bed when I feel {5}.", options: [["sleep","early","angry"], ["lunch","bed","tutor"], ["go","leave","return"], ["bag","jeans","car"], ["sleepy","angry","alert"]], answers: ["early", "lunch", "leave", "car", "sleepy"] }, part2: { topic1: { title: "Race", sentences: ["A member of staff will give you a numbered armband to wear.", "On your arrival, please go to the information point at the north gate.", "To do this, you just need to give us your photo card.", "Please put this on immediately and join other competitors at the warm-up area.", "Runners must register here at least 30 minutes before the race starts at 9am."], order: [4, 1, 3, 5, 2] }, topic2: { title: "Fire Instructions", sentences: ["When you reach the bottom of these stairs, leave the building through front entrance.", "Next, walk calmly to the doors marked Emergency Exit.", "Outside, gather on the grass and wait for further instructions.", "Through these doors, there are stairs leading you to the ground floor.", "When you hear the alarm, leave your bags and belongings at the desk."], order: [4, 2, 5, 3, 1] } }, part3: { texts: { A: "I see too many people who do not arrange a good time to travel to work, they often arrive at work late. I always think in advance about what time I will get to work tomorrow and what means of transport I will use.", B: "Buses are often full of people, especially during rush hour. This makes me very uncomfortable when I have to travel to work by bus. The public transportation improvement plan proposed by the city is very reasonable and it will improve the above situation a lot.", C: "In my opinion, the bus is very clean and comfortable to travel. I find it has a lot of space for everyone, and the bus system is also very large. Therefore, I think improving the public transport system is unnecessary, while the old system is still good.", D: "Building a new public transportation system will be very costly. And we all know it's at the expense of residents. I think we should use that money for something more beneficial, which is building more hospitals. Hospitals in this living area are very few." }, questions: ["Who thinks the new station will cost too much to build?", "Who thinks the bus is too busy?", "Who thinks transport system doesn't need improving?", "Who thinks people should plan their journeys better?", "Who thinks the bus service is good?", "Who thinks better medical facilities are needed?", "Who thinks the new station will improve train travel?"], answers: ["D", "B", "C", "A", "C", "D", "B"] }, part4: { paragraphs: ["Unlike many modern sports competitions, the Doggett’s Coat and Badge race offers no financial reward. The red coat and silver badge have cultural and emotional value, but not monetary. Contestants take part out of pride, tradition, and a deep respect for the waterman’s profession. Many dedicate months to training, not for riches but for the honor of winning one of Britain’s most historic races. The lack of financial incentive may even enhance the race’s prestige, showing that commitment to heritage and community can outweigh commercial interests. In today’s world, that kind of motivation stands out as truly admirable.", "Although the Doggett’s race remains one of the oldest sporting events in the world, some have raised concerns about its future. With modern boats, technology, and shifting interests among younger generations, participation has declined in recent decades. Suggestions have been made to modernize the race to keep it relevant—perhaps by changing the route, updating the boats, or increasing promotion on social media. Others argue that preserving tradition is more important than making it popular. This ongoing discussion reflects broader challenges faced by many traditional events in the modern world: how to honor the past while adapting to the present.", "Winning the Doggett’s Coat and Badge race is not just about rowing fast—it’s about gaining respect within a close-knit community. For many, this competition represents an important rite of passage. It is often the first time a newly qualified waterman competes on such a historic stage. Success in the race can lead to recognition, offers from exclusive rowing clubs, and opportunities to participate in ceremonial roles along the Thames. Even those who do not win often benefit from simply being involved. The reputation built through this race can carry weight throughout a rower’s career, especially in London’s traditional maritime circles.", "The Doggett’s Coat and Badge race was established in 1715 by Thomas Doggett, an Irish actor and theatre manager, who became well known in London. According to popular accounts, Doggett once narrowly escaped drowning while traveling on the River Thames. To express his gratitude for the boatman who saved him and to honor the newly crowned King George I, he created this race. It was open to young watermen who had recently completed their apprenticeships, giving them a chance to demonstrate their rowing skills. Over time, this event became not just a tribute to a personal event, but a long-standing tradition that celebrates both history and the craft of rowing on the Thames.", "One of the most heartwarming aspects of the Doggett’s race is its multi-generational appeal. In several families, competing in the race is a proud tradition passed from one generation to the next. It’s not uncommon to hear stories of grandfathers, fathers, and sons all having taken part over the years. Some families even have multiple winners across decades. These personal connections add emotional depth to the event and preserve its history in living memory. For these families, the race is more than a competition—it’s a legacy. The bond between relatives strengthens as they share stories, train together, and wear the symbolic red coat with pride.", "The prize awarded to the winner of the Doggett’s Coat and Badge race is unlike any ordinary trophy. Instead of money or medals, the champion receives a traditional red coat and a silver badge. These items are deeply symbolic and represent the pride and respect historically associated with watermen. Each piece is custom-made for the winner and presented in a formal ceremony that highlights the cultural importance of the event. The coat reflects 18th-century styles, while the badge often includes royal imagery and references to the Thames. This unique reward continues to connect the modern race with its historical roots and honors the profession’s heritage.", "In the early 18th century, London’s roads were often muddy, overcrowded, and difficult to travel on. As a result, the River Thames served as the main “highway” through the city. People frequently used water taxis—small boats rowed by trained professionals called watermen—to move around quickly. These water journeys were not only faster but often safer than traveling by road. For many Londoners, taking a boat was the most efficient way to attend work, markets, or social events. The Doggett’s race, therefore, celebrates not just rowing skill, but the essential role that watermen played in daily life during that time." ], headings: ["Earning a reputation", "Not in it for the money", "A need for change", "The easiest way to travel", "Origins of what the winner receives", "Generations of champions", "Result of a lucky escape"], answers: [1, 2, 0, 6, 5, 4, 3] } },
        { id: 6, title: "Test 6: Early Australia", part1: { text: "The water is {1}. The {2} is out. I have an {3} holiday. After {4} so hard. I hope to {5} your letter.", options: [["sour","clear","see"], ["wind","dust","sun"], ["tired","enjoyable","good"], ["working","sleeping","eating"], ["tell","read","forward"]], answers: ["clear", "sun", "enjoyable", "working", "read"] }, part2: { topic1: { title: "Report", sentences: ["You should also include a list of books that you use for reference.", "When you have finished your report, correct all the mistakes.", "Remember to save links to websites and include them in your report.", "Before you start to write your report, you should look at websites for the information you need.", "After you make the corrections, send your report by your email."], order: [3, 4, 2, 1, 5] }, topic2: { title: "Printer", sentences: ["Before using the printer, you need to put papers into it.", "A light comes on at the front of the printer.", "When your printer is in place, turn it on using the switch.", "If the light is green, your printer is ready to use.", "First, you need to find an appropriate place to put your printer."], order: [5, 3, 2, 4, 1] } }, part3: { texts: { A: "I know a little about famous painters and their works. But I don't like going to art exhibitions unless my friend invites me. I like extracurricular activities more, painting exhibitions seem too quiet to me. I like to draw, and I have been drawing ever since I can remember. My forte in drawing is animals, especially big and ferocious animals.", B: "I find going to see paintings similar to reading books. You must look and read before discussing. When I go to exhibitions with my friends, they often talk before seeing the painting, and what they talk about isn't even about the painting, that's annoy me.", C: "I find polite art very fascinating. I often go to talks about arts and I have gone to many foreign art exhibitions and artists' houses. It's great to see their works and where they worked.", D: "My parents often took me to see art exhibitions when I was a child. and I think that habit remains. Currently, I often take my children to the exhibition, which is a lovely activity for me. I often ask my children to do other activities while looking at pictures, for example, think of a story for that picture, so they don't get bored." }, questions: ["Who prefers going to art exhibitions with other people?", "Who has some artistic skills?", "Who prefers seeing exhibitions by themselves?", "Who thinks seeing exhibitions is a boring activity?", "Who has a good knowledge of art?", "Who thinks visitors should focus on the art?", "Who has been going to art exhibitions all their life?"], answers: ["D", "A", "B", "A", "C", "B", "D"] }, part4: { paragraphs: ["Despite the many difficulties, both ancient and modern explorers showed incredible perseverance in reaching and understanding Australia. Whether navigating unknown seas in simple rafts or trekking across searing deserts with limited supplies, their determination pushed the boundaries of what was thought possible. Stories of survival and discovery continue to inspire awe, reminding us of the strength and courage required to explore the unknown. Through the centuries, this spirit of exploration has become a core part of Australian history and identity.", "It is now widely believed that the journey to Australia wasn’t completed in one go. Instead, early humans likely reached the continent in stages, moving through island chains and coastal areas over generations. This theory is supported by the distribution of artifacts and remains across Southeast Asia and Northern Australia. The idea of gradual migration, rather than a single wave, helps explain the diversity of early populations found on the continent. This step-by-step approach also reflects how ancient peoples adapted to different environments as they moved closer to the Australian mainland.", "Many of the first explorers to attempt crossing Australia's interior were ill-prepared for the harsh conditions they encountered. Without sufficient knowledge of the land or survival skills in such a hostile environment, numerous expeditions ended in tragedy. The lack of understanding of the Aboriginal methods of finding water, navigating terrain, and managing heat led to avoidable suffering. It wasn't until later that European settlers began to adapt, learning from Indigenous Australians how to travel and survive in such an unfamiliar landscape.", "The vast Australian outback and its harsh deserts have long posed a formidable challenge to resettlement and development. For thousands of years, the central areas of the continent were difficult to inhabit due to extreme heat, scarce water sources, and isolation. Even after European arrival, these natural barriers prevented deeper exploration and settlement for decades. Today, the environment still remains an obstacle, limiting infrastructure, agriculture, and population growth in these regions. The Australian landscape, while beautiful and iconic, continues to shape the way communities are formed and connected.", "In recent years, new evidence has emerged from both land and sea, prompting scientists to re-evaluate earlier assumptions. A set of ancient tools discovered in a Northern Territory cave doesn't match previously known Aboriginal designs, leading some to speculate about earlier migrations or even contact with other civilizations. Additionally, genetic studies hint at complex interactions with now-extinct human species. These findings, while not yet definitive, open the door to exciting discussions and possibilities about Australia's earliest human history.", "Advancements in marine technology have revolutionized our understanding of ancient migration routes to Australia. Underwater sonar mapping and satellite imaging have revealed submerged land masses and potential seafaring paths once used by early humans. Archaeologists are now uncovering tools and fossils deep beneath coastal waters, which provide new insights into how long ago people arrived on the continent. These discoveries would not be possible without modern equipment that allows exploration of areas previously inaccessible. As research continues, scientists hope to fill in many historical gaps that have puzzled historians for centuries.", "Some researchers are rethinking the traditional narrative of how Australia was settled. While it is widely believed that the first people arrived via land bridges from Southeast Asia during the Ice Age, new theories suggest otherwise. Alternative histories propose that early humans may have used rudimentary boats to cross from distant shores far earlier than previously estimated. These claims are controversial but are supported by some archaeological findings and oral traditions of Indigenous communities. Such ideas challenge the Eurocentric view of exploration and emphasize the ingenuity of early seafarers long before written records existed." ], headings: ["A Journey made by stages", "A new evidence that leads to speculation", "An alternative history of settlement", "Lack of knowledge and skills", "Determination of the explorers through the ages", "Natural barrier to resettlement", "Technology helps uncover the ocean’s secret"], answers: [4, 0, 3, 5, 1, 6, 2] } },
        { id: 7, title: "Test 7: Eating in China", part1: { text: "I imagine you don't want to {1} this. I {2} you earlier but you were not home. Can you be {3} before 7pm? I can {4} you at your place then. Don't have too much {5} because we're going to eat cake.", options: [["love","remember","miss"], ["called","told","said"], ["early","sleepy","ready"], ["hold","meet","miss"], ["talk","pencil","dinner"]], answers: ["miss", "called", "ready", "meet", "dinner"] }, part2: { topic1: { title: "Betty Barr", sentences: ["In the 1980s, she finally returned to China and still lives with her Shanghai husband, George Wang.", "After she finished her school, she went to Wellesley College, a famous university in USA.", "However, she missed China, and applied for a job in Hong Kong, where she taught from 1959 to 1972, and learnt to speak Cantonese, the local language.", "At that time, Shanghai is a city filled with many people from different countries.", "She was born in Shanghai in 1933 to an American mother and a father from Scotland."], order: [5, 3, 4, 2, 1] }, topic2: { title: "Key Card", sentences: ["If you lose this, you will need to see the staff member at the front desk.", "You will also need to show your identification card.", "He or she will ask for your name and your flat number, and then will write these down.", "To enter the building and use the lift, you will need your key card.", "He or she will make a copy of it and give you a new key card."], order: [2, 4, 3, 1, 5] } }, part3: { texts: { A: "I feel very lucky to have this park here. My family and I often go to the park because of the natural landscape here. It's different from the city, which is very busy and full of dust. Unfortunately, I am away this weekend so I cannot help with the cleaning. However, I know my brother and his friends will be very interested in this cleanup so I will ask them if they can help.", B: "I'm a very busy person and I have to spend this weekend with my family because I only have the weekend as free time. I think young people who don't have families should help. Besides, students and schools also have days off on weekends. I think this volunteering will be very helpful for students' future careers.", C: "I think this volunteering is a good idea but it doesn't have a long-term vision. When volunteers clean up the park, it will be clean, but it will become busy again after about a month when tourist season arrives. I think we should clean this park regularly about once a month. Surrounding areas such as the lake and local forest should also be cleaned up. We should also have signs telling visitors to clean up their trash. I am very upset when I see a lot of trash on both sides of the road.", D: "My family and I often spend time at the park. My children love going to the park and they find the park a very interesting place to visit. My son has a dream of becoming a biologist so I think cleaning up this park will be very helpful for my son. I think we should pique children's interest in cleaning. They will be more willing to volunteer and help others." }, questions: ["Who thinks volunteering is important for students?", "Who thinks the park is a beautiful place to relax?", "Who asks for others to help?", "Who thinks the cleaning needs to be done regularly?", "Who can't clean the park because of their busy work?", "Who asks for others to help?", "Who thinks local areas need cleaning?"], answers: ["D", "A", "A", "C", "B", "A", "C"] }, part4: { paragraphs: ["There are signs that Chinese food culture and eating habits are changing. Chinese people now consume a wide variety of foods from many different countries. People in cities also prefer fast and convenient foods. In addition, some traditional products such as milk are consumed less by Chinese people than in the past.", "The concept of yin and yang has a complex influence on Chinese cuisine. In fact, this concept also appears in many other areas of life. It can be understood that yin and yang are opposite elements that complement each other to achieve a certain balance. Sweet and sour, cold and hot are typical examples of this concept. Some foods can be classified into hot or cold groups, such as lemon is considered cold and onion is considered hot. Based on this concept, Chinese people choose suitable foods to maintain the balance of the body.", "Cooking methods are also regionally specific, in addition to the differences in food in these regions. However, there are some food techniques that are considered to be standard in Chinese culture. For example, vegetables are cut into small pieces and eaten with chopsticks. The Chinese have a long history of using chopsticks. The Chinese also often leave fish and meat with bones. According to them, this makes the food more delicious. Steaming is a very popular form of cooking. In addition, frying food with cooking oil is also commonly used.", "In addition to the concept of yin and yang directly influencing the culinary culture, the Chinese also pay close attention to the availability of ingredients. Each region has its own ingredients, and this leads to differences in regional cooking styles. The coastal areas in the south of the country are famous for seafood dishes. In the north, the widespread cultivation of wheat has led to noodle dishes. The southwestern regions are famous for spicy soups, while some regions are famous for grilled meat.", "The change in Chinese eating habits has a global impact. Due to its huge population, the food demand of the Chinese market will directly affect domestic and international food production. The change in diet leads to problems such as the increase in related diseases that a large economy like China is prone to. Therefore, achieving a balance like the yin-yang philosophy in Chinese culinary culture is clearly a big challenge.", "The most common way for Chinese people to eat is street food. It is very common to see stalls selling all kinds of food on both sides of the road. This has become a part of the food culture. For large dining events, the food is often placed in the middle of the table so that guests can try different dishes. The meal is served with tea and sometimes rice wine from the local area.", "Chinese culinary culture is like most other cultures in the world. It started with very basic hunting and gathering. Over time, society gradually developed, and with it, culinary culture developed. Gradually, cuisine became an art form and seemed to reach its peak in the 19th century. Although most Chinese people choose simple food with rice and vegetables, it is undeniable that Chinese culinary art has reached the level of exploiting the maximum flavor and each ingredient." ], headings: ["Regional variations", "Effects of a changing diet", "The influence of philosophy", "The origins of chinese food", "Changes in the Chinese diets", "Cooking methods", "The style of eating"], answers: [4, 2, 5, 0, 1, 6, 3] } },
        { id: 8, title: "Test 8: Frozen Land", part1: { text: "I just reviewed the latest report, but the budget doesn’t {1}. Could you get the financial {2} and check for any errors? I {3} it will help clarify the issue. Please read the information {4} so we don’t miss any details. Also, send me the results {5} you go home, not after.", options: [["work","count","balance"], ["department","statement","accountant"], ["sure","assure","think"], ["beautifully","fluently","slowly"], ["when","before","between"]], answers: ["balance", "statement", "think", "slowly", "before"] }, part2: { topic1: { title: "New Students", sentences: ["You can use this card to borrow books from library and access lesson materials online.", "A member of staff will ask for your name and your address.", "You will find these in material links on your home page.", "When you arrive at the university, go to the help desk.", "He or she will enter your information into the computer and give you an identification card."], order: [4, 2, 5, 1, 3] }, topic2: { title: "Solve Problem", sentences: ["You can also compare your results with experiments in the past.", "Then, you need to perform experiments to see if these ideas are true or not.", "The next one is to form a hypothesis or an idea based on your information.", "In this way, you can add to your knowledge of the subject for future experiments.", "The first step is to find out what you know about the problem."], order: [4, 3, 2, 5, 1] } }, part3: { texts: { A: "Last year, I went on a mountain climbing trip with my friends. It was the most horrible trip I have ever experienced. However, after that trip, I had a strong passion for walking. So now, every day I walk as a hobby, and it also helps my health a lot. I'm old so I'm no longer interested in traveling to far away places. Instead, I want to lie on a comfortable sofa and watch my favorite TV show.", B: "When I travel somewhere, I often ask for bus routes to famous tourist destinations so that I can get to those places as quickly as possible and avoid wasting time going around. Famous tourist destinations are the places I want to explore the most when traveling somewhere. I don't understand why many people just like to sit still at the beach when traveling, I find that uninteresting and time-consuming.", C: "My family and I often plan to travel every time we have a vacation. If the weather is nice then our plans go ahead as usual, if not, we will postpone that vacation. For my family, light wind and warm sunlight are important when we go out. A few of my friends invited me to go climbing, but I'm afraid of heights so I refused them. However, in the future I really want to try mountain climbing once.", D: "Next month's trip will be the first time I travel to another country. Normally I only travel to famous local places or in my country. These places are beautiful but I'm so excited to travel to a foreign place once in my life." }, questions: ["Who prefers to stay at home?", "Who thinks a holiday requires good weather?", "Who likes seeing tourist attractions?", "Who wants to go mountaineering trip?", "Who has never been abroad?", "Who likes going walking?", "Who think going to the beach is boring?"], answers: ["A", "C", "B", "C", "D", "A", "B"] }, part4: { paragraphs: ["Despite being covered in thick sheets of ice, Antarctica has a surprisingly diverse and dramatic landscape hidden beneath its surface. Using ground-penetrating radar and satellite imaging, scientists have discovered vast mountain ranges, deep valleys, and even ancient lakes buried under kilometers of ice. These findings suggest that Antarctica was once a very different environment. Studying this hidden geography helps researchers understand the Earth's geological past, as well as how changes in climate may affect the region’s ice coverage in the future.", "Antarctica has often been described as the end of the Earth. Located at the southernmost point of the planet, it remains one of the most mysterious and least accessible places for humans. It’s surrounded by the Southern Ocean and sits opposite the Arctic in the global geography. For centuries, explorers speculated whether such a place existed at all. Today, while satellite images and scientific missions provide more data, the continent still retains an aura of the unknown, attracting adventurers and scientists who want to experience the planet’s final frontier.", "Although Antarctica is not claimed as a country, several nations have laid territorial claims over parts of the continent. However, under the Antarctic Treaty System signed in 1959, no single country has full ownership. Instead, the region is governed collectively by over 50 countries that have agreed to preserve it for peaceful and scientific purposes. No military activity is allowed, and scientific cooperation is encouraged. This unique model of international governance helps protect the fragile environment of the frozen land and ensures that its resources are not exploited for commercial gain.", "The early 20th century saw a dramatic competition between nations to reach the South Pole. Most famously, British explorer Robert Falcon Scott and Norwegian Roald Amundsen led rival expeditions. Amundsen reached the Pole first in 1911, using dog sleds and careful planning. Scott arrived weeks later, only to perish on the return journey with his team. The race to the pole was one of the most extreme tests of human endurance and remains one of the most iconic chapters in the history of polar exploration.", "Antarctica is the coldest place on Earth, with temperatures regularly dropping below –60°C in winter. The continent’s high altitude, its position near the South Pole, and the fact that sunlight is absent for months all contribute to its extreme chill. Its white ice surface also reflects most of the sun’s heat back into the atmosphere. These unique features make it difficult for heat to accumulate, and as a result, the region remains frozen even in summer. Understanding these conditions helps scientists study global weather patterns and climate change.", "The first known landing on Antarctica took place in the early 19th century when a group of seal hunters unintentionally arrived at the icy coastline. Later, exploratory missions were organized specifically to set foot on the continent. In 1895, a Norwegian expedition became the first officially recognized landing. These early steps were dangerous and uncertain, with little knowledge of the terrain or weather. Still, the achievement marked a turning point in human exploration, showing that even the most remote and inhospitable places on Earth could be reached with courage and persistence.", "Travel across Antarctica remains one of the most difficult journeys on Earth. However, modern technology has significantly reduced the physical effort required. In the past, explorers dragged heavy sleds by hand or used animals, often in dangerous and freezing conditions. Today, snowmobiles, tracked vehicles, and even aircraft allow researchers to move equipment and people more easily. While the environment is still harsh, advances in transportation and survival gear make scientific missions more efficient and less life-threatening than those of early explorers." ], headings: ["First step on the ice", "Less effort needed", "Why is it so cold?", "Where is the end of the Earth?", "Who is in charge?", "Race to the pole", "Hidden geography"], answers: [6, 3, 4, 5, 2, 0, 1] } },
        { id: 9, title: "Test 9: Meatless Diet", part1: { text: "It is {1} what I like. And it is the perfect color, {2}. I am going to wear it {3} my birthday party. I will save you {4} cake. {5} my love to everyone.", options: [["yet","not","just"], ["so","too","to"], ["to","on","at"], ["many","none","some"], ["Give","Hold","Receive"]], answers: ["just", "too", "at", "some", "Give"] }, part2: { topic1: { title: "Buying House", sentences: ["Such requirements of course depend on your personal circumstances.", "In order to choose the right place, you need to consider several factors.", "Other factors to look at are the place of employment, shops and schools.", "The first and most important thing is to choose the location.", "The most important of these to look at is the price of homes."], order: [5, 2, 4, 1, 3] }, topic2: { title: "Public Cycle", sentences: ["When you finish your journey, return the bike to any empty collection point.", "Choose \"hire the cycle\" on the screen and then follow the instructions to receive an unlock code.", "When the light comes, you can unlock your bike and start your journey.", "Go to the collection point and click on the screen to choose the bike with your bank card.", "Enter the code on the lock of the bike and wait for the green lights."], order: [5, 2, 4, 1, 3] } }, part3: { texts: { A: "Exercising with friends is a fantastic idea, don't you think? It adds a fun element to the workout routine. It's important to fuel our bodies properly, though. After a good workout, I always make sure to have a nutritious meal to replenish energy and support muscle recovery.", B: "Establishing a consistent workout routine has really helped me stay on track with my fitness goals. It's amazing how much more I can accomplish when I have a structured plan in place. Plus, it keeps me accountable and ensures I make time for physical activity every day.", C: "Age is just a number when it comes to exercise. Whether you're young or old, staying active is crucial for maintaining overall health and vitality. While competitions can be motivating for some, they're not necessarily suitable for everyone. It's important to find activities that are enjoyable and sustainable for each individual.", D: "Experiencing pain during exercise isn't necessary and it's a sign that something may be wrong. It's important to listen to our bodies and seek expert advice when needed, whether it's from a trainer, physical therapist, or medical professional. Taking care of ourselves properly ensures we can continue to enjoy physical activity without risking injury." }, questions: ["Who thinks experiencing pain is not necessary?", "Who thinks a routine can help us do more sport?", "Who thinks exercise is for both the young and the elderly?", "Who thinks a proper meal is important?", "Who thinks competitions are not useful for everybody?", "Who seeks expert advice at times?", "Who thinks work out with friends is a good idea?"], answers: ["D", "B", "C", "A", "C", "D", "A"] }, part4: { paragraphs: ["Factory farming—the industrialized method of raising animals for food—has been criticized for its negative effects on both animals and the environment. Animals are often kept in cramped, stressful conditions, and the use of antibiotics to promote growth raises concerns about resistance. Additionally, factory farms contribute to pollution and greenhouse gas emissions. These harmful impacts are among the key reasons why some people choose to reduce or eliminate meat from their diet. Supporting ethical and sustainable food sources is becoming a growing priority for many consumers.", "A common benefit reported by people who switch to a plant-based diet is improved health. Many experience lower cholesterol levels, better digestion, and increased energy. Vegetarian diets are often rich in fiber, antioxidants, and healthy fats. Studies show that people who consume more fruits, vegetables, whole grains, and legumes tend to have lower risks of heart disease and obesity. However, balance is key—a diet full of processed plant foods can still be unhealthy. When done right, a meatless diet can be a strong foundation for a healthy lifestyle.", "People adopt meatless diets for many different reasons. For some, religious beliefs guide their eating habits, while others avoid meat out of concern for animal welfare. Some are motivated by environmental issues, believing that reducing meat consumption lowers their carbon footprint. Health is also a major factor, as some studies link vegetarian diets to lower risks of heart disease and diabetes. The motivations are as varied as the people who choose them, and it's not uncommon for individuals to follow a plant-based lifestyle for a combination of reasons.", "Many people wonder if it's truly possible to live without eating meat. The answer is yes, as proven by millions of vegetarians and vegans worldwide. While it requires some planning to ensure a balanced intake of protein, iron, and vitamin B12, plant-based diets can be nutritionally complete. In fact, major health organizations have stated that well-planned vegetarian and vegan diets are suitable for all stages of life, including childhood and pregnancy. With a variety of plant-based options now available, choosing a meatless lifestyle is more practical than ever.", "Reducing meat consumption can also be seen as a global responsibility. Livestock farming is a major contributor to climate change, water usage, and deforestation. By choosing plant-based options, individuals can lower their environmental impact and support a more sustainable food system. Small changes made by many people can have a big collective effect. From conserving water to reducing greenhouse gas emissions, a meatless diet can be a meaningful step toward addressing some of the planet’s most urgent environmental challenges.", "Vegetarianism is not a single dietary choice but includes many different forms. Some vegetarians avoid meat but still eat dairy and eggs—these are called lacto-ovo vegetarians. Others, like vegans, avoid all animal-derived products, including honey and gelatin. There are also pescatarians, who exclude meat but still consume fish. Flexitarians mostly eat plant-based foods but occasionally include meat or fish. These variations show that a meatless diet can be adapted to individual needs and beliefs, making it a flexible and increasingly popular choice for people around the world.", "At the core of many vegetarian beliefs is the idea of respecting all forms of life. For some, avoiding meat is a moral decision rooted in the belief that animals have the right to live without suffering. This perspective emphasizes empathy, compassion, and non-violence. It is also reflected in certain spiritual or religious practices where harming living beings is discouraged. Choosing a meatless diet becomes more than just a personal choice—it represents a commitment to treating all creatures with dignity and care." ], headings: ["Possible to happen", "Our responsibilities for global", "Health gets better with diet", "Respect the life", "Farming Factory – it is a harmful thing", "Types of Vegetarian", "Various explanations"], answers: [4, 2, 6, 0, 1, 5, 3] } },
        { id: 10, title: "Test 10: Music", part1: { text: "I am never {1}. In the mornings, I attend {2}. I eat lunch in the {3}. I buy food from the {4}. I always {5} dinner for myself.", options: [["late","soon","early"], ["meetings","dinner","breakfast"], ["park","city","village"], ["shop","window","car"], ["cook","drink","breathe"]], answers: ["late", "meetings", "park", "shop", "cook"] }, part2: { topic1: { title: "Jay Mist", sentences: ["It was a major action movie and he gained famous from that film.", "At one of these events, an actor agent saw him and gave him a starring role.", "They left their home country and took Jay to live in the United States.", "Jay was very good at that and he participated in a bodybuilding competition.", "He started study at the school in that country, and in his free time he did some strength. exercise"], order: [5, 4, 1, 3, 2] }, topic2: { title: "Potatoes", sentences: ["This colour means it is perfect for growing, you should put some earth in the pot and dig it deep down.", "An old potato will have little roots, will be a little green, and won't be good for eating.", "With this care, you should see a potato plant growing after couples of weeks.", "All you need is some earth, an old potato and a big spot.", "When you've done this, you should water it every day and place it in a sunny spot."], order: [3, 2, 5, 1, 4] } }, part3: { texts: { Ali: "I like traveling to the beach. I think I have to walk quite a distance from the hotel to the beach so I think I have to bring boots. however, when I opened the suitcase I didn't see any boots. But I still completed the trip and visited many beautiful beaches. One great thing is that the beaches are in remote areas so there are very few tourists. However, it also makes finding food and drinks more difficult.", Bruno: "As an architect, I have always been interested in how buildings are constructed. So when I travel, I never spend time lying on the beach or buying souvenirs. I will go around the area to see the architecture of the houses. I chose to go around by taxi, it was great. However, it cost me a lot because I traveled alone and had no one to share the costs with. But for me this was still a great experience because I got to see many old houses", Carla: "The sharp bends of the island made me abandon the idea of ​​renting a car, because it was very dangerous. I decided to take the bus, it was also much cheaper. However, the bus routes are quite few and there are many time constraints. We toured the neighborhoods on foot. I loved this experience because I could see many beautiful sights.", Deniz: "There's a lot of food here and I spend most of my time eating. I can't recommend any of the dishes because they are all very impressive. If you want to cook for yourself, you will have to take the bus to the market. Don't forget to visit the street market because they sell a lot of cool local products. I have a lot of good bargains there." }, questions: ["Who loved eating food here?", "Who liked to walk?", "Who forgot to bring something?", "Who liked to be alone?", "Who liked buying things on the island?", "Who thought public transport could be improved?", "Who spent a lot of money on transport?"], answers: ["Deniz", "Carla", "Ali", "Ali", "Deniz", "Carla", "Bruno"] }, part4: { paragraphs: ["For many people, music is a deeply emotional experience. It offers a unique and personal way to express feelings that may be difficult to put into words. Composing melodies, writing lyrics, or simply playing with passion allows individuals to explore their emotional world and communicate it with others. Music can reflect joy, sadness, hope, or frustration. For this reason, it is often used in therapy to help people process emotions. In creative expression, music becomes both an emotional release and a form of personal storytelling.", "Many people report feeling happier and more balanced when music is part of their daily life. Playing or listening to music can reduce stress, improve mood, and create a sense of inner peace. It provides a break from daily routines and offers something meaningful to focus on. Some use music to relax before bed, while others rely on it to energize their mornings. The emotional and psychological benefits are powerful, making music a simple yet effective tool for personal well-being.", "Scientific studies have shown that learning to play music strengthens memory. When musicians play, they must recall notes, rhythms, and sequences, sometimes in real-time. Reading sheet music while coordinating hands or breath with timing challenges the brain, forming new neural pathways. This mental exercise has even been linked to improved academic performance in children and better memory retention in older adults. Whether memorizing entire pieces or remembering finger positions, the mental workout of music can benefit cognitive health across all age groups.", "Learning music requires dedication and routine. Students must practice regularly, attend rehearsals, and develop time management skills to balance music with other responsibilities. This structure helps build self-discipline and patience. Mastering an instrument takes months, even years, and involves repeating scales, fixing mistakes, and gradually improving. These habits transfer to other areas of life, helping musicians stay focused and committed to long-term goals. Music teaches that progress comes through consistency and effort over time.", "Musicians often develop a heightened awareness of other people’s emotional states. In group settings, they must listen carefully and respond to changes in tone, tempo, or mood. This sensitivity helps them stay in harmony with others, both musically and socially. Playing music with others encourages empathy and understanding. Over time, this experience fosters emotional intelligence—a skill that benefits communication, relationships, and social awareness in everyday life.", "While music is often associated with emotional expression, playing certain instruments can be surprisingly physical. Percussionists, drummers, and even pianists require strong coordination, stamina, and posture. Marching band musicians must walk in sync for long hours, often while carrying heavy instruments. String players need muscular endurance in their fingers and arms, and wind instrument players must have good lung capacity. Practicing regularly and performing under pressure also places physical demands on the body. In this way, music isn’t only mentally engaging—it can also be quite the workout.", "Music often brings people together, whether in choirs, orchestras, or bands. Being part of a musical group requires teamwork and offers regular opportunities to meet new people. This shared experience fosters a strong sense of community and belonging. For many, joining a music class or ensemble is not just about performance, but also about making friends and socializing in a relaxed, collaborative setting. Over time, these connections can turn into lasting friendships, broadening one's personal and professional network." ], headings: ["Develop a greater sense of well-being", "A great opportunity to broaden your social circle", "A physically demanding activity", "A way to learn discipline and the importance of routine", "Enhanced sensitivity to other people's feelings", "A good way to boost your memory", "A creative outlet for expressing emotions"], answers: [6, 0, 5, 3, 4, 2, 1] } }

    // --- APP STATE & STORAGE ---
    const appState = {
        user: { name: 'Học viên', target: 'B2', theme: 'light' },
        results: {} 
    };
    let timerInterval, timeLeft = 1800;

    function init() {
        loadData();
        renderNav();
        document.addEventListener('mouseup', handleSelection);
        document.addEventListener('touchend', handleSelection);
    }

    function loadData() {
        const storedUser = localStorage.getItem('aptis_user_profile_v2');
        if (storedUser) {
            appState.user = JSON.parse(storedUser);
            document.getElementById('welcome-overlay').style.display = 'none';
            if(appState.user.theme === 'dark') document.body.classList.add('dark-mode');
        } else {
            document.getElementById('welcome-overlay').style.display = 'flex';
        }
        const storedRes = localStorage.getItem('aptis_results_v2');
        if (storedRes) {
            appState.results = JSON.parse(storedRes);
        }
        updateDashboardInfo();
    }

    function saveData() {
        localStorage.setItem('aptis_user_profile_v2', JSON.stringify(appState.user));
        localStorage.setItem('aptis_results_v2', JSON.stringify(appState.results));
    }

    function saveUserProfile() {
        appState.user.name = document.getElementById('user-name').value.trim() || 'Học viên';
        appState.user.target = document.getElementById('user-target').value;
        saveData();
        document.getElementById('welcome-overlay').style.display = 'none';
        updateDashboardInfo();
    }

    function updateDashboardInfo() {
        document.getElementById('user-welcome-banner').innerHTML = `<h3>Xin chào, ${appState.user.name}!</h3><div>Mục tiêu hiện tại: <strong>Level ${appState.user.target}</strong></div>`;
        const doneCount = Object.keys(appState.results).length;
        document.getElementById('stat-completed').innerText = `${doneCount}/10`;
        let totalScaled = 0;
        Object.values(appState.results).forEach(r => totalScaled += r.scaled);
        const avg = doneCount > 0 ? Math.round(totalScaled / doneCount) : 0;
        let avgCefr = 'A0';
        if (avg >= 43) avgCefr = 'C';
        else if (avg >= 37) avgCefr = 'B2';
        else if (avg >= 31) avgCefr = 'B1';
        else if (avg >= 20) avgCefr = 'A2';
        else if (avg >= 10) avgCefr = 'A1';
        document.getElementById('stat-avg').innerText = doneCount > 0 ? `${avg}/50 (${avgCefr})` : '--';
    }

    function resetAllData() {
        if(confirm("Bạn có chắc chắn muốn xóa toàn bộ dữ liệu học tập không?")) {
            localStorage.removeItem('aptis_user_profile_v2');
            localStorage.removeItem('aptis_results_v2');
            location.reload();
        }
    }

    function renderNav() {
        const navList = document.getElementById('nav-list');
        navList.innerHTML = '';
        const dashBtn = document.createElement('div');
        dashBtn.className = 'nav-item active'; dashBtn.innerHTML = '📊 Dashboard';
        dashBtn.onclick = () => switchTest('dashboard', dashBtn);
        navList.appendChild(dashBtn);
        testsData.forEach(test => {
            const btn = document.createElement('div');
            btn.className = 'nav-item';
            let badge = '';
            const res = appState.results[test.id];
            if (res) {
                btn.classList.add('completed');
                badge = `<span class="nav-score">${res.cefr}</span>`;
            }
            btn.innerHTML = `${test.title} ${badge}`;
            btn.onclick = () => switchTest(test.id, btn);
            navList.appendChild(btn);
            if (!document.getElementById(`test-${test.id}`)) {
                const div = document.createElement('div');
                div.id = `test-${test.id}`;
                div.className = 'test-container';
                div.innerHTML = renderTestHTML(test);
                document.getElementById('tests-wrapper').appendChild(div);
            }
        });
    }

    function renderTestHTML(data) {
        let html = `<h2>${data.title}</h2>`;
        html += `<div class="part-section"><div class="part-title">Part 1: Sentence Completion</div><div class="gap-text">`;
        let p1 = data.part1.text;
        data.part1.options.forEach((opt, i) => {
            let sel = `<select class="gap-select" id="t${data.id}_p1_${i}"><option value="">(?)</option>`;
            opt.forEach(o => sel += `<option value="${o}">${o}</option>`);
            sel += `</select>`;
            p1 = p1.replace(`{${i+1}}`, sel);
        });
        html += `${p1}</div></div>`;
        const renderTopic = (topic, tid) => {
            let h = `<div style="margin-bottom:20px;"><strong>Topic: ${topic.title}</strong>`;
            topic.sentences.forEach((sent, i) => {
                h += `<div class="ordering-item"><select id="t${data.id}_p2_${tid}_${i}"><option>-</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select><div>${sent}</div><div id="ans_t${data.id}_p2_${tid}_${i}" class="ans-reveal" style="display:none"></div></div>`;
            }); return h + `</div>`;
        };
        html += renderTopic(data.part2.topic1, 1) + renderTopic(data.part2.topic2, 2) + `</div>`;
        html += `<div class="part-section"><div class="part-title">Part 3: Opinion Matching</div><div class="reading-text">`;
        Object.entries(data.part3.texts).forEach(([name, txt]) => html += `<p><strong>${name}:</strong> ${txt}</p>`);
        html += `</div>`;
        data.part3.questions.forEach((q, i) => {
            let opts = '';
            Object.keys(data.part3.texts).forEach(key => opts += `<label><input type="radio" name="t${data.id}_p3_${i}" value="${key}"> ${key}</label>`);
            html += `<div class="question-row" id="t${data.id}_p3_row_${i}"><span>${i+1}. ${q}</span><div class="radio-group">${opts}</div><div id="ans_t${data.id}_p3_${i}" class="ans-reveal" style="display:none"></div></div>`;
        });
        html += `</div>`;
        html += `<div class="part-section"><div class="part-title">Part 4: Matching Headings</div>`;
        data.part4.paragraphs.forEach((para, i) => {
            let opts = `<select id="t${data.id}_p4_${i}" style="width:100%; margin-bottom:10px; font-weight:bold;"><option value="">-- Choose Heading --</option>`;
            data.part4.headings.forEach((head, hIdx) => opts += `<option value="${hIdx}">${head}</option>`);
            opts += `</select>`;
            html += `<div class="paragraph-text" id="t${data.id}_p4_box_${i}">${opts}${para}<div id="ans_t${data.id}_p4_${i}" class="correction-box" style="display:none"></div></div>`;
        });
        html += `</div><button class="btn-submit" onclick="submitTest(${data.id})">NỘP BÀI (SUBMIT)</button><div id="res-${data.id}" class="result-panel" style="display:none"></div>`;
        return html;
    }

    function switchTest(id, btn) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.test-container').forEach(el => el.classList.remove('active'));
        if (id === 'dashboard') {
            document.getElementById('dashboard').classList.add('active');
            stopTimer();
            document.getElementById('current-test-name').innerText = "Dashboard";
            updateDashboardInfo();
        } else {
            document.getElementById(`test-${id}`).classList.add('active');
            document.getElementById('current-test-name').innerText = testsData.find(t => t.id === id).title;
            startTimer();
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 1800; updateTimerDisplay();
        timerInterval = setInterval(() => { timeLeft--; updateTimerDisplay(); if (timeLeft <= 0) { clearInterval(timerInterval); alert("Hết giờ!"); } }, 1000);
    }
    function stopTimer() { clearInterval(timerInterval); document.getElementById('timer-display').innerText = "--:--"; document.getElementById('timer-display').classList.remove('timer-warning'); }
    function updateTimerDisplay() {
        const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
        const d = document.getElementById('timer-display');
        d.innerText = `${m}:${s < 10 ? '0'+s : s}`;
        if(timeLeft < 300) d.classList.add('timer-warning'); else d.classList.remove('timer-warning');
    }

    function submitTest(id) {
        clearInterval(timerInterval); 
        const timeUsedSeconds = 1800 - timeLeft;
        const minutes = Math.floor(timeUsedSeconds / 60);
        const seconds = timeUsedSeconds % 60;
        const timeString = `${minutes} phút ${seconds} giây`;

        const test = testsData.find(t => t.id === id);
        let raw = 0, total = 0;

        // Scoring Logic
        test.part1.answers.forEach((ans, i) => { 
            total++; const el = document.getElementById(`t${id}_p1_${i}`); 
            if(el.nextElementSibling && el.nextElementSibling.classList.contains('ans-reveal')) el.nextElementSibling.remove();
            if(el.value === ans) { raw++; el.classList.add('correct'); } else { el.classList.add('incorrect'); el.insertAdjacentHTML('afterend', `<span class="ans-reveal ans-correct-label">Đúng: ${ans}</span>`); } 
        });
        [1, 2].forEach(tid => {
            const topic = tid === 1 ? test.part2.topic1 : test.part2.topic2;
            topic.order.forEach((ans, i) => { 
                total++; const el = document.getElementById(`t${id}_p2_${tid}_${i}`); const reveal = document.getElementById(`ans_t${id}_p2_${tid}_${i}`);
                if(parseInt(el.value) === ans) { raw++; el.classList.add('correct'); reveal.style.display='none'; } 
                else { el.classList.add('incorrect'); reveal.style.display='inline-block'; reveal.innerHTML = `<span class="ans-wrong-label">Bạn: ${el.value}</span> <span class="ans-correct-label">Đúng: ${ans}</span>`; } 
            });
        });
        test.part3.answers.forEach((ans, i) => { 
            total++; const els = document.getElementsByName(`t${id}_p3_${i}`); let val = null; els.forEach(r => { if(r.checked) val = r.value; }); 
            const row = document.getElementById(`t${id}_p3_row_${i}`); const reveal = document.getElementById(`ans_t${id}_p3_${i}`);
            if(val === ans) { raw++; row.classList.add('correct'); reveal.style.display = 'none'; } 
            else { row.classList.add('incorrect'); reveal.style.display = 'inline-block'; reveal.className = "ans-reveal ans-correct-label"; reveal.innerText = `Đáp án đúng: ${ans}`; } 
        });
        test.part4.answers.forEach((ans, i) => { 
            total++; const el = document.getElementById(`t${id}_p4_${i}`); const box = document.getElementById(`t${id}_p4_box_${i}`); const reveal = document.getElementById(`ans_t${id}_p4_${i}`);
            if(parseInt(el.value) === ans) { raw++; box.classList.add('correct'); reveal.style.display='none'; } 
            else { box.classList.add('incorrect'); reveal.style.display='block'; reveal.innerHTML = `⚠️ Đáp án đúng là: "${test.part4.headings[ans]}"`; } 
        });

        const scaled = Math.round((raw / total) * 50);
        let cefr = scaled >= 43 ? 'C' : scaled >= 37 ? 'B2' : scaled >= 31 ? 'B1' : scaled >= 20 ? 'A2' : scaled >= 10 ? 'A1' : 'A0';
        
        appState.results[id] = { raw, total, scaled, cefr, time: timeString, date: new Date().toISOString() };
        saveData();
        renderNav(); 

        const res = document.getElementById(`res-${id}`);
        res.style.display = 'block';
        res.innerHTML = `
            <h3>KẾT QUẢ BÀI LÀM (Đã lưu)</h3>
            <p style="font-size: 1.1rem;">Điểm số: <strong>${raw}/${total}</strong> (Quy đổi: ${scaled}/50)</p>
            <p>Trình độ ước tính: <strong style="color:var(--accent); font-size:1.5rem">${cefr}</strong></p>
            <p>⏱️ Thời gian hoàn thành: <strong>${timeString}</strong></p>
            <hr>
            <p><em>Hãy xem lại các câu sai (màu đỏ) phía trên để rút kinh nghiệm.</em></p>
        `;
        res.scrollIntoView({behavior:'smooth'});

        // FETCH TO GOOGLE APPS SCRIPT
        const payload = {
            userName: appState.user.name,
            testTitle: test.title,
            score: `${raw}/${total} (${scaled}/50)`,
            cefr: cefr,
            timeUsed: timeString
        };
        const webAppUrl = "https://script.google.com/macros/s/AKfycbwM1X1uPq_B1_pUG7XQyttVqoSpOCqcnDxceCJnixdTcHsZlH2V4nie5PKzfWjvKFY/exec";
        fetch(webAppUrl, {
            method: 'POST',
            mode: 'no-cors',
            cache: 'no-cache',
            body: JSON.stringify(payload)
        }).then(() => console.log("Gửi thành công!")).catch(err => console.error("Lỗi:", err));
    }

    let currentRange = null;
    function handleSelection(e) {
        if (e.target.closest('#hl-toolbar')) return;
        const sel = window.getSelection();
        const toolbar = document.getElementById('hl-toolbar');
        if (sel.rangeCount > 0 && !sel.isCollapsed) {
            const range = sel.getRangeAt(0);
            const container = range.commonAncestorContainer.nodeType === 1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentNode;
            if (container.closest('.reading-text') || container.closest('.paragraph-text') || container.closest('.gap-text')) {
                currentRange = range;
                const rect = range.getBoundingClientRect();
                toolbar.style.display = 'flex';
                toolbar.style.top = `${rect.top}px`; 
                toolbar.style.left = `${rect.left + (rect.width / 2)}px`;
                return;
            }
        }
        toolbar.style.display = 'none'; currentRange = null;
    }
    function highlight(cls) {
        if (!currentRange) return;
        if (cls === 'clear') { document.designMode = "on"; document.execCommand("removeFormat", false, null); document.designMode = "off"; }
        else { try { const span = document.createElement('span'); span.className = cls; currentRange.surroundContents(span); } catch (e) { alert("Chỉ chọn văn bản trong cùng một đoạn."); } }
        window.getSelection().removeAllRanges(); document.getElementById('hl-toolbar').style.display = 'none';
    }
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        appState.user.theme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
        saveData();
    }
    init();
</script>
</body>
</html>
