<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APTIS Reading Master Suite v2.4 (Auto-Save)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #2980b9;
            --accent: #e67e22;
            --success: #27ae60;
            --danger: #c0392b;
            --bg-body: #f4f7f6;
            --bg-card: #ffffff;
            --text-main: #333333;
            --border-color: #e0e0e0;
            --reading-bg: #fdfdfd;
            --overlay-bg: rgba(44, 62, 80, 0.95);
        }

        body.dark-mode {
            --primary: #1a252f;
            --secondary: #3498db;
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #ecf0f1;
            --border-color: #333;
            --reading-bg: #2c3e50;
            --overlay-bg: rgba(0, 0, 0, 0.95);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-body); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- OVERLAYS --- */
        #welcome-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-bg); z-index: 5000;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .welcome-card {
            background: var(--bg-card); width: 100%; max-width: 400px;
            padding: 30px; border-radius: 12px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .form-control { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid var(--border-color); border-radius: 8px; background: var(--bg-body); color: var(--text-main); }
        .btn-start { width: 100%; padding: 15px; background: var(--secondary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-reset { background: var(--danger); margin-top: 10px; font-size: 0.9rem; padding: 10px 20px; }

        /* --- TIMER & LAYOUT --- */
        #timer-bar {
            background: var(--primary); color: white; padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 2000; height: 50px; flex-shrink: 0;
        }
        .timer-warning { color: #e74c3c; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .app-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: var(--bg-card); border-right: 1px solid var(--border-color); overflow-y: auto; display: flex; flex-direction: column; flex-shrink: 0; }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; position: relative; scroll-behavior: smooth; }

        .nav-header { padding: 15px; border-bottom: 1px solid var(--border-color); font-weight: bold; color: var(--secondary); display: flex; justify-content: space-between; }
        .nav-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; }
        .nav-item:hover { background-color: rgba(0,0,0,0.05); }
        .nav-item.active { background-color: var(--secondary); color: white; border-left: 4px solid var(--accent); }
        .nav-score { font-size: 0.8rem; font-weight: bold; background: rgba(0,0,0,0.1); padding: 2px 6px; border-radius: 4px; display: none; }
        .nav-item.completed .nav-score { display: inline-block; background-color: var(--success); color: white; }

        .test-container { max-width: 900px; margin: 0 auto; display: none; padding-bottom: 50px; }
        .test-container.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { color: var(--secondary); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        .part-section { background: var(--bg-card); padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .part-title { font-size: 1.1rem; font-weight: bold; color: var(--accent); margin-bottom: 15px; border-left: 4px solid var(--accent); padding-left: 10px; }

        .reading-text, .paragraph-text, .gap-text {
            line-height: 1.8; font-size: 1.05rem; background: var(--reading-bg);
            padding: 15px; border-radius: 6px; border: 1px solid var(--border-color);
            margin-bottom: 15px; text-align: justify; white-space: pre-wrap;
        }
        
        select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; background: white; max-width: 100%; cursor: pointer; }
        .gap-select { margin: 0 5px; font-weight: bold; color: var(--secondary); border: 1px solid var(--secondary); }
        
        .question-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--border-color); align-items: center; flex-wrap: wrap; }
        .radio-group { display: flex; gap: 15px; }
        .ordering-item { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; background: var(--reading-bg); padding: 10px; border-radius: 5px; flex-wrap: wrap;}

        /* --- HIGHLIGHTER --- */
        #hl-toolbar {
            position: fixed; display: none; background: #333; padding: 5px 10px;
            border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 9999;
            transform: translateX(-50%) translateY(-100%); margin-top: -10px;
        }
        #hl-toolbar::after {
            content: ''; position: absolute; top: 100%; left: 50%; margin-left: -5px;
            border-width: 5px; border-style: solid; border-color: #333 transparent transparent transparent;
        }
        .hl-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid white; margin: 0 4px; cursor: pointer; display: inline-block; }
        .marker-yellow { background-color: #ffeb3b; } .hl-y { background-color: #ffeb3b; color: #000; }
        .marker-green { background-color: #a5d6a7; } .hl-g { background-color: #a5d6a7; color: #000; }
        .marker-pink { background-color: #f48fb1; } .hl-p { background-color: #f48fb1; color: #000; }
        .marker-blue { background-color: #90caf9; } .hl-b { background-color: #90caf9; color: #000; }
        .marker-clear { background-color: #fff; color: #333; font-size: 14px; display: flex; align-items: center; justify-content: center; font-weight: bold;}

        /* --- RESULTS --- */
        .correct { border: 2px solid var(--success) !important; background-color: rgba(39, 174, 96, 0.1); }
        .incorrect { border: 2px solid var(--danger) !important; background-color: rgba(192, 57, 43, 0.1); }
        .ans-reveal { display: inline-block; margin-left: 10px; font-weight: bold; font-size: 0.9rem; padding: 2px 8px; border-radius: 4px; }
        .ans-correct-label { color: #fff; background-color: var(--success); }
        .ans-wrong-label { color: #fff; background-color: var(--danger); margin-right: 5px; }
        .correction-box { display: block; width: 100%; margin-top: 5px; padding: 5px 10px; background-color: #e8f5e9; border-left: 4px solid var(--success); color: var(--text-main); font-size: 0.95rem; font-weight: bold; }

        .btn-submit { background: var(--secondary); color: white; border: none; padding: 15px 40px; font-size: 1.1rem; border-radius: 30px; cursor: pointer; font-weight: bold; display: block; margin: 20px auto; width: 100%; max-width: 300px; transition: all 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .user-welcome { background: linear-gradient(135deg, var(--secondary), var(--primary)); color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .result-panel { background: var(--bg-card); border: 2px solid var(--secondary); border-radius: 10px; padding: 20px; text-align: center; margin-top: 20px; animation: slideUp 0.5s; }
        
        /* Dashboard Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }
        .stat-card { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; text-align: center; }
        .stat-val { font-size: 1.5rem; font-weight: bold; display: block; }
        .stat-label { font-size: 0.9rem; opacity: 0.9; }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 150px; }
            .question-row { flex-direction: column; align-items: flex-start; gap: 8px; }
            .radio-group { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <div id="welcome-overlay">
        <div class="welcome-card">
            <h2>🚀 APTIS Master v2.4</h2>
            <p>Hệ thống tự động lưu kết quả làm bài.</p>
            <input type="text" id="user-name" class="form-control" placeholder="Nhập tên của bạn">
            <select id="user-target" class="form-control">
                <option value="A2">Mục tiêu: A2</option>
                <option value="B1">Mục tiêu: B1</option>
                <option value="B2" selected>Mục tiêu: B2</option>
                <option value="C">Mục tiêu: C</option>
            </select>
            <button class="btn-start" onclick="saveUserProfile()">BẮT ĐẦU</button>
        </div>
    </div>

    <div id="timer-bar">
        <div>⏱️ <span id="current-test-name">Dashboard</span></div>
        <div id="timer-display">--:--</div>
    </div>

    <div class="app-container">
        <div class="sidebar">
            <div class="nav-header">
                <span>DANH SÁCH BÀI TẬP</span>
                <span onclick="toggleTheme()" style="cursor:pointer" title="Chế độ Sáng/Tối">🌗</span>
            </div>
            <div id="nav-list"></div>
        </div>

        <div class="main-content" id="main-area">
            <div id="hl-toolbar">
                <div class="hl-btn marker-yellow" onmousedown="highlight('hl-y')" title="Vàng"></div>
                <div class="hl-btn marker-green" onmousedown="highlight('hl-g')" title="Xanh"></div>
                <div class="hl-btn marker-pink" onmousedown="highlight('hl-p')" title="Hồng"></div>
                <div class="hl-btn marker-blue" onmousedown="highlight('hl-b')" title="Lam"></div>
                <div class="hl-btn marker-clear" onmousedown="highlight('clear')" title="Xóa màu">✕</div>
            </div>

            <div id="dashboard" class="test-container active">
                <div class="user-welcome" id="user-welcome-banner"><h3>Xin chào!</h3></div>
                
                <h2>Tiến Độ Học Tập</h2>
                <div class="part-section">
                    <p>Hệ thống sẽ tự động lưu kết quả của bạn trên thiết bị này.</p>
                    <div class="stats-grid">
                        <div class="stat-card" style="background:var(--secondary); color:white">
                            <span class="stat-val" id="stat-completed">0/10</span>
                            <span class="stat-label">Đã hoàn thành</span>
                        </div>
                        <div class="stat-card" style="background:var(--success); color:white">
                            <span class="stat-val" id="stat-avg">--</span>
                            <span class="stat-label">Điểm TB (Quy đổi)</span>
                        </div>
                    </div>
                    <hr style="margin:20px 0; border:0; border-top:1px dashed #ccc;">
                    <p style="font-size:0.9rem; color:#666">Nếu bạn muốn xóa toàn bộ lịch sử làm bài để bắt đầu lại:</p>
                    <button class="btn-start btn-reset" onclick="resetAllData()">⚠️ Xóa toàn bộ dữ liệu & Làm lại</button>
                </div>
            </div>

            <div id="tests-wrapper"></div>
        </div>
    </div>

<script>
    // --- DỮ LIỆU ĐẦY ĐỦ ---
    const testsData = [
        {
            id: 1, title: "Test 1: Charles Dickens",
            part1: { text: "I saw some shows in the {1} of one store. I didn't {2} it. I buy some food at the {3}. I ate {4}. I {5} a program on TV.", options: [["market", "window", "shoe"], ["eat", "drink", "buy"], ["classroom", "park", "market"], ["watch", "door", "cake"], ["ate", "saw", "watched"]], answers: ["window", "buy", "market", "cake", "watched"] },
            part2: { topic1: { title: "Tom Harper", sentences: ["He soon wrote regularly for the magazine, but he was not satisfied.", "He almost left the magazine, but then he decided to create some unusual new characters.", "When he was young, he began writing short stories for a magazine.", "This popularity made Tom Harper rich and successful.", "The characters he imagined were one of the most famous in the world."], order: [2, 3, 1, 5, 4] }, topic2: { title: "Albert Einstein", sentences: ["Princeton University in the USA offered him a job because he was so famous.", "As a child, he moved to a special school because he was so clever.", "She later became his wife and helped him with his earliest scientific discoveries.", "His best friend in his new class was a girl named Lavime.", "These were so advanced that he soon became famous all over the world."], order: [5, 1, 3, 2, 4] } },
            part3: { texts: { A: "I have a dream that I work as a tour guide. So I understand that I will have to fly to other countries. In my personal opinion, airplanes are currently too cheap compared to the damage they cause to the environment, so I believe we should add taxes to airline ticket prices to make people choose to use other means of transport before they think about flying. I believe that people are also very happy when they can contribute to protecting the environment.", B: "My family and siblings live quite far from me. So I often have to fly to visit them every month when I have time. We really appreciate the time we spend together and we are happy to be able to meet each other and share our new story. I know that traveling by plane too much is not good for the environment so I often shop online or go to work by bike instead of going by car or I reuse plastic bags and paper bags. In addition, I sometimes volunteer to clean up trash in the neighborhood.", C: "I was a businessman so I had to fly many times a week. I had to go to other countries to be able to sign wine trading contracts with them. I felt very tired every time I have to fly. Now, my sister and I, whenever we have free time, take the train together and we enjoy that time very much because I can travel while sightseeing and relax without any stress.", D: "If I have to go somewhere I will choose other means of public transport, not the plane. Every time I go on a plane I feel extremely tired and I just hope time passes quickly so I can get off that plane. However, due to the specific nature of my job, I have to film in many different locations, so sometimes I cannot avoid having to take this public transportation." }, questions: ["Who wants to work in other countries?", "Who tries to protect the environment?", "Who needs to fly for their work?", "Who visits relatives regularly?", "Who suggests making flights more expensive?", "Who likes relaxing while they travel?", "Who finds flying tiring?"], answers: ["A", "B", "D", "B", "A", "C", "D"] },
            part4: { paragraphs: ["The popularity of Dickens's works in our time remains a global phenomenon. Although he wrote his novels in the 19th century, his works have had a global impact. In addition, these masterpieces helped connect Renaissance drama to the multimedia revolution. Many readers find the characters and themes surprisingly modern.", "Shakespeare's plays are difficult to understand and sometimes require the reader to struggle or think twice to figure out the character's thoughts. Sometimes the dialogue tends to be emotional without any connection to the context of the story. There are many passages that are a confusing mess of single words and old classical vocabulary.", "Hamlet is a Renaissance tragedy written by Shakespeare. The play is very long and has plot twists that keep the reader guessing. Dickens had a special interest in the work. He told his daughter to keep an eye on Hamlet. For Dickens' novels, he sometimes created serial editions, with new chapters released monthly, keeping readers eagerly awaiting the next issue.", "Dickens’ legacy is undeniable. His works have been translated and used in over 100 countries and are studied by most schoolchildren in the world. It has even been said that Dickens’ legacy belongs not to one era but to all times. It is easy to see that Dickens lives on in society and culture through his language and through his enduring influence on education and the media.", "Dickens achieved success at a young age. His first novel, The Pickwick Papers, was published when he was only 24 and became a bestseller. His success increased throughout the 1590s. He was honored as a member of the Lord Chamber Men - those lucky enough to perform for the Queen of England on many occasions. Alongside his novels and plays, he also published many poems in his own style.", "As Dickens's reputation grew, the question arose whether to preserve his legacy and make it live on. Dickens himself was always keen to make his mark and to maintain his uniqueness. He even attempted to break the dominance of the popular comedies of the time with a series of dramatic plays.", "To mark the 400th anniversary of Dickens’ death, there will be a number of events to help readers, and especially students, better understand his works. There will be videos detailing the content of each of his works to help people excitedly explore the pinnacle of language and the meaning his works bring to our daily lives."], headings: ["Difficulties for modern readers", "Dicken’s early success", "Dicken for our time", "Trying to protect his property", "The influence of the media", "Bring the books to life", "Keep the reader guessing"], answers: [2, 0, 6, 4, 1, 3, 5] }
        },
        {
            id: 2, title: "Test 2: Children & Exercise",
            part1: { text: "I {1} in a flat. I {2} it with my friend. We are in the same {3}. We {4} to work. We like to {5} dinner.", options: [["go","live","walk"], ["share","drink","hold"], ["door","class","chair"], ["drive","smile","say"], ["hold","cook","melt"]], answers: ["live", "share", "class", "drive", "cook"] },
            part2: { topic1: { title: "Delivery Man", sentences: ["You must return your keys to the office manager after you get back.", "You should arrive at the main office by 6.30am and collect your keys.", "You must follow the route on the map to deliver packages.", "When you have completed all deliveries, return to your office.", "In the office, you can also collect a map of your route."], order: [5, 1, 3, 4, 2] }, topic2: { title: "Conference Hall", sentences: ["When you arrive at the conference hall, give your booking number.", "After he finishes, there will be time for questions.", "Inside you will find a schedule of events and the information of the key speaker.", "If you would like to attend his talk, it will take place in the main hall at midday.", "A staff member will note this down and give you a welcome pack."], order: [1, 5, 3, 4, 2] } },
            part3: { texts: { A: "This is my first time coming to this restaurant. The food is very cheap but the quality is excellent. I was very surprised with the starter because its menu is very diverse. But there is one thing that I want the restaurant to improve. The restaurant band played live music but it was very far away, so the sound was very low and it didn't make the meal atmosphere lively. Next time turn the music louder, please!", B: "This is a very famous restaurant that I saw in the newspaper. Sadly, I arrived later than the rest of the party, so I didn't get to order dinner. However, I ordered orange juice and mango juice and they were both delicious. What about the surroundings? Lively music along with fashionable and appropriate decor makes me feel very comfortable.", C: "I'm not sure if I will return to this restaurant. I think the staff was arguing when I got there, because the atmosphere here was not very comfortable. As for the food, I think there's nothing to write about. I ordered fish and chips, it wasn't bad, but it wasn't good either. But many people say that the food here is fabulous. So, I think I'm an exception.", D: "I don't understand why this restaurant is so famous. When I arrived and saw a menu with lots of different dishes, I saw this as a bad sign. Furthermore, the menu with traditional dishes contrasting with the modern decoration style made me feel very confused and strange. The waiters here were also not friendly. This was one of my worst experiences eating at a restaurant." }, questions: ["Who thought the music was too quiet?", "Who will definitely not return to the restaurant?", "Who was impressed by the range of appetizers?", "Who thinks the food was of average quality?", "Who thought his bad experience was probably unusual?", "Who enjoyed the atmosphere?", "Who didn't eat anything at the restaurant?"], answers: ["A", "D", "A", "C", "C", "B", "B"] },
            part4: { paragraphs: ["In recent years, children have become increasingly inactive. While technology often receives blame for this trend, it is not the only factor at play. Urbanization has led to a lack of safe play spaces for kids. Many neighborhoods no longer have parks or playgrounds, forcing children to stay indoors. This combination of screen time and limited physical activity opportunities is contributing to a decline in children's overall fitness and health.", "Currently, the issue of children not getting enough exercise is worsening, largely due to the time they spend staring at screens. The allure of laptops and smartphones is hard to resist, making it difficult for both parents and children to limit their use. As awareness grows about the importance of physical activity, it is essential for everyone to recognize the seriousness of this problem and work together to find effective solutions that encourage a more active lifestyle.", "One inspiring example comes from a teacher who implemented a program called the Daily Mile. Each day, students are encouraged to run at least one mile, and this simple idea quickly gained popularity. It has won awards for its effectiveness and has spread to over 3,500 schools in more than 30 countries, thanks to media coverage and positive testimonials. This initiative highlights how even small changes can have a significant impact on promoting physical activity among children.", "The Daily Mile program not only enhances fitness levels among students but also has surprising benefits for their academic performance. Teachers have reported that students participating in this program are more focused and alert during lessons. Psychologists support this observation, suggesting that a healthy body leads to a healthy mind. The saying \"a strong body, a strong mind\" appears to hold true, as regular physical activity positively influences students ' ability to learn and retain information.", "The design of our environments can significantly impact how we behave. For instance, workplaces are often designed to enhance productivity, and homes are structured to encourage communication. Similarly, schools can be designed to promote physical activity. By creating spaces that encourage movement, such as open areas for play and exercise, educators can foster more active lifestyle among students, helping to counteract the trend of inactivity.", "One innovative architect from Japan has designed a kindergarten with a unique approach. The playground is structured like a running track, allowing children to run and play freely. This creative design has proven successful and has even received awards for its impact on children's activity levels. Such thoughtful architectural designs can inspire other schools to rethink how they create environments that promote both learning and physical activity.", "The Daily Mile initiative and the Japanese architect's playground represent two ends of the economic spectrum. The Daily Mile is a cost - effective program that requires minimal investment, while the architect's design involves significant funding. Local authorities must consider various factors when striving for a balance between promoting physical activity and managing budgets. By exploring both affordable and innovative solutions, communities can create environments that support children's health and well - being."], headings: ["The success of a simple idea", "Achieving the right balance", "The wider effects of regular activity", "The situation has the potential of being worst", "Ways in which environment can influence behaviour", "Factors contributing to inactivity", "A design for exercise and for study"], answers: [5, 3, 0, 2, 4, 6, 1] }
        },
        {
            id: 3, title: "Test 3: Coffee",
            part1: { text: "I am living with a family {1} the city. The children are {2} to me. Seamus and Agnes {3} speaking English with me. Sometimes, I {4} to Seamus and Agnes. I hate the food, {5} yesterday I ate out.", options: [["next","near","under"], ["cruel","noisy","friendly"], ["read","hold","practise"], ["see","read","say"], ["then","so","also"]], answers: ["near", "friendly", "practise", "read", "so"] },
            part2: { topic1: { title: "Paper Work", sentences: ["When you do this, a new window will open.", "After you send your course work, you should check your email.", "In your account, press “open a new window”.", "Once you put the files there, press the “send” button.", "Simply drag or drop your files."], order: [2, 5, 1, 4, 3] }, topic2: { title: "Traffic Lights", sentences: ["As a result of these delays, many people were not able to get to work on time.", "This created long delays in the roads to the city’s business district.", "Therefore, there were not further delays for people going back home.", "They were out of order and the traffic moved very slowly.", "Fortunately, in the evening, the traffic lights were working again."], order: [3, 2, 5, 1, 4] } },
            part3: { texts: { A: "My wife often complains about not having time to read, and I say we have to make our own time. So, I often calculate my free time on my phone. so I can know in advance whether I should bring a book to read on the train. My wife often laughs at me for doing so, but I don't mind, as long as I can finish reading so many books.", B: "I used to struggle very much to finish reading a book that we were expected to read. However, now that I read for my own pleasure, I don't mind too much. I usually don't limit myself to reading one at a time. There are so many titles I can choose from that get me excited. I have a list of books that I want to read in the future.", C: "I often keep a book on the bedside table to read before going to bed. The problem is, I get tired after reading only half of a page, and I fall asleep. So, I've been reading that one book for half a year now and have only read chapter 2. However, when I read factual books, I find it very interesting and it keeps me awake for hours.", D: "My job requires reading a lot of books. These books include a lot of facts and figures and they are very boring. When I have free time, I usually want to read light books, like mystery novels or comedy. I often read on the train to work. I have a young child, so when I come home I almost don't have time to read. Therefore, I have to read books when traveling by train. So, a book can last me 1 week." }, questions: ["Who wants to read a lot of books?", "Who plans their reading schedule?", "Who reads many books at once?", "Who reads more than another family member?", "Who is having difficulty in finishing a book?", "Who thinks that factual books are boring?", "Who has limited time to read books?"], answers: ["B", "A", "B", "A", "C", "D", "D"] },
            part4: { paragraphs: ["The custom of drinking coffee has been around for a long time, perhaps as long as 1500 years ago. There were times when drinking coffee was banned in many places. At that time, coffee houses were opened in some places in Egypt and Ethiopia. Later, the custom of drinking coffee spread to Italy and all over Europe. Not long after that, the Dutch introduced coffee to Asia. Later, the habit of drinking coffee became popular all over the world.", "Coffee was first used in Africa but Europe is known as the largest coffee consuming region in the world. In the 18th century, many people from different professions such as writers, philosophers and politicians used coffee to stay awake during discussions and meetings. Coffee houses became meeting places for people to share ideas and debate hot topics in society. These places made it easy for people to share their intellectual thoughts and played an important role in business and society at that time.", "Nowadays, many people have the habit of drinking coffee in the morning to wake up, or going to coffee shops in the evening to meet and socialize with each other. Coffee shops are popping up everywhere, providing places for people to relax and talk to each other. Coffee has become a global business, with personal coffee makers even appearing in households. Famous global coffee brands have become giant companies, using their brands and communication strategies to attract millions of coffee lovers around the world.", "Coffee consumption in Europe accounts for about 90% of global coffee production, making it the largest market in the world. Meanwhile, some other countries in Africa such as Egypt and Ethiopia rely heavily on coffee exports to sustain their economies. However, there is a problem of injustice: workers in these African countries face terrible living and working conditions, with incomes as low as $1 a day. While wealthy European countries make huge profits from coffee, people in coffee-growing countries do not receive a fair share of their efforts and hard work.", "To address this injustice, certification schemes for agricultural production have been introduced. If coffee meets certain certification standards, it can be sold at fair prices, preventing growers from having to sell at rock-bottom prices. However, there are problems with this solution. In reality, only about 5% of coffee meets the standards. Many small coffee producers in developing countries are too poor to pay the certification fees, leaving them even further behind in the global coffee market.", "There is much debate about the effects of coffee on human health. It is true that coffee can help many people stay awake and concentrate. It contains antioxidants, which can help prevent diseases. But while drinking coffee, people often add sugar and milk and these can be harmful to your health. This can easily cause diseases such as diabetes or obesity for those who use it.", "There is a legend about coffee. In the past, a monk observed that birds became more active and lively when they ate a small fruit. The monk then drank the juice from the fruit and stayed awake praying and talking until late at night. So it can be said that thanks to these birds, people knew about the coffee plant."], headings: ["Coffee encourages the art of conversation", "Problems of coffee economy", "The ancient origin of coffee", "Health risks versus health benefits debate", "The custom of coffee drinking begins to spread", "A remedy of unjust revenue distribution", "A habit that has become a big economy"], answers: [4, 0, 6, 1, 5, 3, 2] }
